services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cityecho
      POSTGRES_USER: cityecho
      POSTGRES_PASSWORD: cityecho
    ports:
      - "5432:5432"
    volumes:
      - cityecho-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cityecho -d cityecho"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cityecho:cityecho@db:5432/cityecho
      CITYECHO_JWT_SECRET: ${CITYECHO_JWT_SECRET:-thay-secret-nay-khi-trien-khai}
      CITYECHO_ADMIN_PASSWORD: ${CITYECHO_ADMIN_PASSWORD:-admin123}
      CITYECHO_EDITOR_PASSWORD: ${CITYECHO_EDITOR_PASSWORD:-editor123}
      CITYECHO_MEDIA_DIR: /app/media
    ports:
      - "8000:8000"
    volumes:
      - cityecho-media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  cityecho-db:
  cityecho-media:
