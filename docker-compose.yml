services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cityecho
      POSTGRES_USER: cityecho
      POSTGRES_PASSWORD: cityecho
    ports:
      - "5432:5432"
    volumes:
      - cityecho-db:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cityecho:cityecho@db:5432/cityecho
    ports:
      - "8000:8000"
    depends_on:
      - db
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  cityecho-db:
